<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUXORA | Premium Shopping</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #faf8f5;
    color: #29231f;
}

header {
    background: #211d19;
    color: white;
    padding: 20px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

.logo {
    color: #e7c38b;
    font-size: 28px;
    letter-spacing: 3px;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 10px;
}

.cart {
    color: #e7c38b;
    font-weight: bold;
}

.hero {
    text-align: center;
    padding: 90px 20px;
    background: #e9dfd1;
}

.hero h2 {
    font-size: 42px;
    margin-bottom: 15px;
}

.hero p {
    font-size: 18px;
}

.hero button, .product button {
    background: #29231f;
    color: white;
    border: none;
    padding: 12px 22px;
    margin-top: 20px;
    cursor: pointer;
    border-radius: 5px;
}

.search {
    text-align: center;
    padding: 30px 15px 0;
}

.search input {
    width: 80%;
    max-width: 450px;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

.products {
    padding: 45px 6%;
    text-align: center;
}

.products h2 {
    font-size: 30px;
}

.product-list {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 25px;
    margin-top: 30px;
}

.product {
    background: white;
    width: 230px;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 3px 12px #00000012;
}

.product img {
    width: 100%;
    height: 210px;
    object-fit: cover;
    border-radius: 7px;
}

.product h3 {
    margin-top: 12px;
}

.product p {
    margin-top: 8px;
}

.product button {
    margin-top: 12px;
    width: 100%;
}

footer {
    background: #211d19;
    color: white;
    text-align: center;
    padding: 25px;
}

</style>
</head>

<body>

<header>
    <h1 class="logo">LUXORA</h1>

    <nav>
        <a href="#">Home</a>
        <a href="#products">Shop</a>
        <a href="#contact">Contact</a>
    </nav>

    <div class="cart">
        🛒 Cart: <span id="cartCount">0</span>
    </div>
</header>

<section class="hero">
    <h2>Discover Your Elegance</h2>
    <p>Shop your favourite products at Luxora.</p>
    <button onclick="document.getElementById('products').scrollIntoView()">
        Shop Now
    </button>
</section>

<section class="search">
    <input type="text" id="searchInput"
    placeholder="Search products..."
    oninput="searchProducts()">
</section>

<section class="products" id="products">
    <h2>Explore Our Collection</h2>

    <div class="product-list" id="productList">

        <div class="product">
            <img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?w=500" alt="Fashion">
            <h3>Fashion</h3>
            <p>₹799</p>
            <button onclick="addToCart()">Add to Cart</button>
        </div>

        <div class="product">
            <img src="https://images.unsplash.com/photo-1611652022419-a9419f74343d?w=500" alt="Accessories">
            <h3>Accessories</h3>
            <p>₹499</p>
            <button onclick="addToCart()">Add to Cart</button>
        </div>

        <div class="product">
            <img src="https://images.unsplash.com/photo-1596462502278-27bfdc403348?w=500" alt="Beauty">
            <h3>Beauty</h3>
            <p>₹599</p>
            <button onclick="addToCart()">Add to Cart</button>
        </div>

        <div class="product">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" alt="Shoes">
            <h3>Shoes</h3>
            <p>₹999</p>
            <button onclick="addToCart()">Add to Cart</button>
        </div>

    </div>
</section>

<footer id="contact">
    <h3>LUXORA</h3>
    <p>Shop Beyond Ordinary.</p>
    <p>© 2026 Luxora. All Rights Reserved.</p>
</footer>

<script>
let cartCount = 0;

function addToCart() {
    cartCount++;
    document.getElementById("cartCount").innerText = cartCount;
    alert("Product added to cart!");
}

function searchProducts() {
    let input = document.getElementById("searchInput")
        .value.toLowerCase();

    let products = document.querySelectorAll(".product");

    products.forEach(function(product) {
        let name = product.querySelector("h3")
            .innerText.toLowerCase();

        product.style.display =
            name.includes(input) ? "block" : "none";
    });
}
</script>

</body>
</html>
